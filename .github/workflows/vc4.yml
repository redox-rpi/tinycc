# Tests of the VC4 backend on every pull request (WBS 2.15 point 2 in
# redox-rpi/redox-rpi docs/process/wbs.md). GitHub-hosted runners only.
name: vc4

on:
  pull_request:
  push:
    branches: [ vc4, main ]

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: make test
      run: ./configure && make -j"$(nproc)" && make test -k
    - name: make test with -DTCC_LOOP_ROTATE (also both tccb stages)
      run: |
        git clean -qfdx
        ./configure --extra-cflags=-DTCC_LOOP_ROTATE && make -j"$(nproc)"
        make test -k 'TCCFLAGS-unx=-B$(TOP) -I$(TOPSRC)/include -I$(TOPSRC) -I$(TOP) -DTCC_LOOP_ROTATE'

  vc4:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: pins
      run: cat tests/vc4/ci/pins.sh | grep -v '^#' | grep = >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
      with:
        repository: ${{ env.FAT_BOOT_REPO }}
        ref: ${{ env.FAT_BOOT_REV }}
        path: rof
        fetch-depth: 0
    - name: packages
      run: sudo apt-get update -qq && sudo apt-get install -y -qq mtools zstd cmake
    - name: vc4 toolchain (release asset)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download "$VC4_TOOLCHAIN_TAG" --repo "$GITHUB_REPOSITORY" \
          --pattern "$VC4_TOOLCHAIN_ASSET" --dir "$RUNNER_TEMP"
        zstd -dc "$RUNNER_TEMP/$VC4_TOOLCHAIN_ASSET" | tar -C "$RUNNER_TEMP" -xf -
        echo "P=$RUNNER_TEMP/prefix/bin/vc4-elf-" >> "$GITHUB_ENV"
    - name: resim (vc4emul)
      run: echo "E=$(tests/vc4/ci/build-resim.sh "$RUNNER_TEMP/resim")" >> "$GITHUB_ENV"
    - name: vc4-tcc
      run: ./configure --config-bcheck=no --config-backtrace=no && make vc4-tcc
    - name: enc-test
      run: python3 -I tests/vc4/enc-test.py "$P"
    - name: asm-test
      run: tests/vc4/asm-test.sh "$P"
    - name: abi-sim
      run: tests/vc4/abi-sim.sh "$P" "$E"
    - name: fat-sim
      run: tests/vc4/fat-sim.sh rof "$P" "$E"
    - name: bootcode-build LINK=tcc
      run: LINK=tcc tests/vc4/bootcode-build.sh rof "$P"

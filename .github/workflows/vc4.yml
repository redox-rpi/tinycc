# Tests of the VC4 backend on every pull request (WBS 2.15 point 2 in
# redox-rpi/redox-rpi docs/process/wbs.md). GitHub-hosted runners only.
# Simulator tests use redox-rpi/resim (MIT), pinned in tests/vc4/ci/pins.sh
# as in redox-rpi/vc4-toolchain's toolchain.lock.
name: vc4

on:
  pull_request:
  push:
    branches: [ main ]
  # also run by upstream-sync.yml on its merge branch (PRs opened by the
  # workflow token start no pull_request runs)
  workflow_call:
    inputs:
      ref:
        description: branch or commit to test
        type: string
        default: ''

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
    - name: make test
      run: ./configure && make -j"$(nproc)" && make test -k
    - name: make test with -DTCC_LOOP_ROTATE (also both tccb stages)
      run: |
        git clean -qfdx
        ./configure --extra-cflags=-DTCC_LOOP_ROTATE && make -j"$(nproc)"
        make test -k 'TCCFLAGS-unx=-B$(TOP) -I$(TOPSRC)/include -I$(TOPSRC) -I$(TOP) -DTCC_LOOP_ROTATE'

  vc4:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
    - name: pins
      run: cat tests/vc4/ci/pins.sh | grep -v '^#' | grep = >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
      with:
        repository: ${{ env.FAT_BOOT_REPO }}
        ref: ${{ env.FAT_BOOT_REV }}
        path: rof
        fetch-depth: 0
    - name: packages
      run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd mtools fdisk cmake
    - name: vc4 toolchain (release asset)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download "$VC4_TOOLCHAIN_TAG" --repo "$GITHUB_REPOSITORY" \
          --pattern "$VC4_TOOLCHAIN_ASSET" --dir "$RUNNER_TEMP"
        echo "$VC4_TOOLCHAIN_SHA256  $RUNNER_TEMP/$VC4_TOOLCHAIN_ASSET" | sha256sum -c -
        zstd -dc "$RUNNER_TEMP/$VC4_TOOLCHAIN_ASSET" | tar -C "$RUNNER_TEMP" -xf -
        echo "P=$RUNNER_TEMP/prefix/bin/vc4-elf-" >> "$GITHUB_ENV"
    - uses: actions/checkout@v4
      with:
        repository: ${{ env.RESIM_REPO }}
        ref: ${{ env.RESIM_REV }}
        path: resim
    - name: resim (vc4emul)
      run: |
        cmake -S resim -B resim/build >/dev/null && make -C resim/build -s -j"$(nproc)" vc4emul
        echo "E=$PWD/resim/build/vc4emul/vc4emul" >> "$GITHUB_ENV"
    - name: vc4-tcc
      run: ./configure --config-bcheck=no --config-backtrace=no && make vc4-tcc
    - name: enc-test
      run: python3 -I tests/vc4/enc-test.py "$P"
    - name: asm-test
      run: tests/vc4/asm-test.sh "$P"
    - name: abi-sim
      run: tests/vc4/abi-sim.sh "$P" "$E"
    - name: fat-sim
      run: tests/vc4/fat-sim.sh rof "$P" "$E"
    - name: bootcode-build LINK=tcc
      run: LINK=tcc tests/vc4/bootcode-build.sh rof "$P"
    - name: fb-sim (B3s)
      run: |
        git -C rof worktree add -q "$RUNNER_TEMP/rof-fb" "$FB_REV"
        BENCH=1 tests/vc4/fb-sim.sh "$RUNNER_TEMP/rof-fb" "$P" "$E"

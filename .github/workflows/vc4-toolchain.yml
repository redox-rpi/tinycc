# Builds the vc4-elf toolchain once and publishes it, with its source, as a
# release of this repository (tag VC4_TOOLCHAIN_TAG in tests/vc4/ci/pins.sh).
# The vc4 CI (vc4.yml) downloads it; nothing is cached in Actions.
# Run by hand (Actions > vc4 toolchain > Run workflow) after a pin change,
# or by pushing the branch ci/vc4-toolchain.
name: vc4 toolchain

on:
  workflow_dispatch:
  push:
    branches: [ ci/vc4-toolchain ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
    - name: packages
      run: sudo apt-get update -qq && sudo apt-get install -y -qq texinfo flex bison zstd
    - name: build
      run: tests/vc4/ci/build-vc4-toolchain.sh "$RUNNER_TEMP/tc"
    - name: release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        . tests/vc4/ci/pins.sh
        cd "$RUNNER_TEMP/tc"
        notes="vc4-elf binutils, GCC 6.2.1 (C) and newlib from $VC4_TOOLCHAIN_REPO at $VC4_TOOLCHAIN_REV, built on ubuntu-24.04 x86_64 by tests/vc4/ci/build-vc4-toolchain.sh (commit $GITHUB_SHA). For the vc4 CI of this repository. The source tarball is the complete source it was built from (GPL)."
        if ! gh release view "$VC4_TOOLCHAIN_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          gh release create "$VC4_TOOLCHAIN_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "$VC4_TOOLCHAIN_TAG (CI toolchain)" --notes "$notes"
        fi
        gh release upload "$VC4_TOOLCHAIN_TAG" --repo "$GITHUB_REPOSITORY" --clobber "$VC4_TOOLCHAIN_ASSET" \
          "vc4-toolchain-src-${VC4_TOOLCHAIN_REV:0:7}.tar.zst"
